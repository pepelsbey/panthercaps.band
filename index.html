<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>Panthercaps</title>
	<style>
		:root {
			color-scheme: dark;
		}

		body {
			display: grid;
			place-items: center;
			min-height: 100vh;
			min-height: 100dvh;

			color: #fff;
			font-family: system-ui, sans-serif;

		}

			display: block;
			width: clamp(12rem, 80vw, 40rem);
			height: auto;
		}

</head>
<body>
	<h1>
		<img src="logo.svg" alt="Panthercaps" width="1161" height="287">
